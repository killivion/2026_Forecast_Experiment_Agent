# Settings for both searchers, the agent loop and the final evaluation.
gefcom_path: ../GEFCOM2014
gefcom_python: ../GEFCOM2014/.venv/Scripts/python.exe
base_config: configs/dev.yaml      # relative to gefcom_path
final_config: configs/default.yaml # relative to gefcom_path; the once-only final evaluation (99 quantiles)
model: claude-sonnet-5-5           # the tracked searches; cheap test runs: --model claude-haiku-5-5
effort: high                       # medium searches cost only $0.02-0.04, so cost doesn't justify less reasoning (NOTES.md)
# List prices, USD per million tokens. src/agent.py prices every call. Cache reads 0.1x input (Opus 5.5: 0.05x),
# cache writes 1.25x (5 min) / 2x (1 h). Haiku 5.5 bills every token at 5x when a prompt exceeds 100K tokens.
price_per_mtok:
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write_5m: 2.5, cache_write_1h: 4.0}
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.2, cache_write_5m: 5.0, cache_write_1h: 8.0}
  claude-haiku-5-5: {input: 0.1, output: 0.5, cache_read: 0.01, cache_write_5m: 0.125, cache_write_1h: 0.2,
                     long_prompt_factor: 5.0}
budget:
  experiments: 20                  # proposals that passed the guardrails (the start config is not one)
  wall_minutes: 180                # safety cap, should not bind: fast runs take 1-4 min, the heaviest configs ~10-15
  usd: 2.0                         # LLM API spend per search; medium effort measured $0.02-0.04 (4-7 experiments)
accept_rule:
  min_rel_improvement: 0.01        # dev loss more than 1% below the current best (NOTES.md) ...
  min_month_wins: 4                # ... and lower in at least 4 of the 7 dev months
