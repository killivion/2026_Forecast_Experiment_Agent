# Settings for both searchers, the agent loop and the final evaluation.
gefcom_path: ../GEFCOM2014
gefcom_python: ../GEFCOM2014/.venv/Scripts/python.exe
base_config: configs/dev.yaml      # relative to gefcom_path
final_config: configs/default.yaml # relative to gefcom_path; the once-only final evaluation (99 quantiles)
model: claude-sonnet-5-5
effort: high                       # the agent's decisions are what is measured, so no lower effort
# List prices in USD per million tokens; cache write = 1.25x input (5-min TTL). src/agent.py prices every call.
price_per_mtok:
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.2, cache_write: 5.0}
budget:
  experiments: 20                  # proposals that passed the guardrails (the start config is not one)
  wall_minutes: 180                # safety cap, should not bind: fast runs take 1-4 min, the heaviest configs ~10-15
  usd: 5.0                         # agent API spend per search; ~$1-2 expected for 20 experiments
accept_rule:
  min_rel_improvement: 0.01        # dev loss more than 1% below the current best (NOTES.md) ...
  min_month_wins: 4                # ... and lower in at least 4 of the 7 dev months
